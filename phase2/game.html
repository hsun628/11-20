{% extends "global/Page.html" %}
{% load otree %}

{% block styles %}
<style>
    .otree-form-errors { display: none !important; }
    .number-grid {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 20px;
        margin: 25px 0;
    }
    .number-box {
        border: 2px solid #0d6efd;
        border-radius: 12px;
        padding: 15px 0;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
        color: #0d6efd;
        cursor: pointer;
        background: #fff;
    }
    .number-box.selected {
        background: #0d6efd;
        color: #fff;
    }
    #error-warning, #time-warning {
        margin: 15px 0;
        border: 2px solid #dc3545;
        padding: 12px;
        border-radius: 8px;
        background: #fff5f5;
    }
</style>
{% endblock %}

{% block content %}
<h3 class="mb-4"><b>第{{ player.round_number }}回合</b></h3>
<div id="error-warning" class="alert alert-danger" style="display:none;">請先選擇數字！</div>
<div id="time-warning" class="alert alert-danger" style="display:none;">請盡快選擇決策數字！</div>
<p>請選擇您的數字：</p>
<div style="display:none;">{{ form.num }}</div>
<div class="number-grid">
    {% for number in number_choices %}
        <button type="button" class="number-box" data-value="{{ number }}">{{ number }}</button>
    {% endfor %}
</div>
<div class="d-flex justify-content-center mt-4">
    <button type="button" class="btn btn-primary otree-next-button" id="custom-next-btn">Next</button>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const numberInput = document.getElementById("id_num");
        const errorWarning = document.getElementById("error-warning");
        const timeWarning = document.getElementById("time-warning");
        const form = document.querySelector("form");
        const nextButton = document.getElementById("custom-next-btn");
        const boxes = document.querySelectorAll(".number-box");

        numberInput.type = "hidden";
        boxes.forEach(function(box) {
            box.addEventListener("click", function() {
                boxes.forEach(function(item) { item.classList.remove("selected"); });
                box.classList.add("selected");
                numberInput.value = box.dataset.value;
                errorWarning.style.display = "none";
                timeWarning.style.display = "none";
            });
        });

        nextButton.addEventListener("click", function() {
            if (!numberInput.value) {
                timeWarning.style.display = "none";
                errorWarning.style.display = "block";
                window.scrollTo(0, 0);
                return;
            }
            form.submit();
        });

        setTimeout(function() {
            errorWarning.style.display = "none";
            timeWarning.style.display = "block";
            window.scrollTo(0, 0);
        }, 90000);
    });
</script>
{% endblock %}
