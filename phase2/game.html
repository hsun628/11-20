{% extends "global/Page.html" %}

{% block content %}

<h3><b>第{{ player.round_number }}回合</b></h3>

<!-- 錯誤提示區塊 -->
<div id="error-warning" style="display: none; color: #dc3545; font-weight: bold; margin: 15px 0; border: 2px solid #dc3545; padding: 12px; border-radius: 8px; background-color: #fff5f5;">
    請先選擇數字！
</div>

<!-- 90 秒超時提醒區塊 -->
<div id="time-warning" style="display: none; color: #dc3545; font-weight: bold; margin: 15px 0; border: 2px solid #dc3545; padding: 12px; border-radius: 8px; background-color: #fff5f5;">
    請盡快選擇決策數字！
</div>

<style>
    /* 💡 保持一致性：隱藏 oTree 原生頂部的錯誤區塊，避免重複出現 */
    .otree-form-errors {
        display: none !important;
    }

    /* 隱藏 oTree 自動渲染的預設輸入框 */
    #hidden-form-wrapper {
        display: none !important;
    }

    /* 格子容器：分成 10 欄擠在同一行 */
    .number-grid {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 30px; 
        max-width: 100%;
        margin: 25px 0;
    }

    /* 單個格子樣式 */
    .number-box {
        border: 2px solid #0d6efd; 
        border-radius: 12px;       
        padding: 15px 0;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
        color: #0d6efd;            
        cursor: pointer;
        background-color: #ffffff;
        transition: all 0.2s ease-in-out;
        user-select: none;
    }

    /* 滑鼠懸停特效（未被選取時） */
    .number-box:hover:not(.selected) {
        background-color: #f0f5ff; 
        border-color: #0b5ed7;
        transform: scale(1.05);
    }

    /* 被選取時的特效 */
    .number-box.selected {
        background-color: #0d6efd !important; 
        color: white !important;               
        border-color: #0a58ca !important;
        box-shadow: 0 5px 15px rgba(13, 110, 253, 0.45) !important; 
        transform: scale(1.03);
    }
</style>

<p>請選擇您的數字</p>

<div id="hidden-form-wrapper">
    {{ form.num }}
</div>

<div class="number-grid">
    <div class="number-box" data-value="11">11</div>
    <div class="number-box" data-value="12">12</div>
    <div class="number-box" data-value="13">13</div>
    <div class="number-box" data-value="14">14</div>
    <div class="number-box" data-value="15">15</div>
    <div class="number-box" data-value="16">16</div>
    <div class="number-box" data-value="17">17</div>
    <div class="number-box" data-value="18">18</div>
    <div class="number-box" data-value="19">19</div>
    <div class="number-box" data-value="20">20</div>
</div>

<!-- 修改關鍵 1：不使用 {{ next_button }}，改用自訂的純前端按鈕，外觀與 oTree 完全一致 -->
<div class="d-flex justify-content-center mt-4">
    <button type="button" class="btn btn-primary otree-next-button" id="custom-next-btn">Next</button>
</div>

{% endblock %}


{% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const boxes = document.querySelectorAll('.number-box');
        const otreeInput = document.getElementById('id_num');
        const errorWarning = document.getElementById('error-warning');
        const timeWarning = document.getElementById('time-warning');
        const form = document.querySelector('form');
        const customNextBtn = document.getElementById('custom-next-btn');

        // 將原生 input 改為 hidden 類型
        if (otreeInput) {
            otreeInput.type = 'hidden'; 
        }

        // 頁面載入時，檢查並恢復先前選取的格子狀態
        if (otreeInput && otreeInput.value) {
            const savedBox = document.querySelector(`.number-box[data-value="${otreeInput.value}"]`);
            if (savedBox) savedBox.classList.add('selected');
        }

        // 綁定格子的點擊事件
        boxes.forEach(box => {
            box.addEventListener('click', function() {
                boxes.forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                
                if (otreeInput) {
                    otreeInput.value = this.getAttribute('data-value');
                }

                // 💡 覆蓋邏輯：一旦受試者做出選擇，清空清除所有提示訊息
                if (errorWarning) errorWarning.style.display = 'none';
                if (timeWarning) timeWarning.style.display = 'none';
            });
        });

        // 修改關鍵 2：控制自訂按鈕的點擊行為
        if (customNextBtn && form) {
            customNextBtn.addEventListener('click', function(e) {
                // 如果沒選數字，直接在前端阻斷，完全不送出表單給後端伺服器
                if (!otreeInput || !otreeInput.value || otreeInput.value.trim() === "") {
                    // 💡 覆蓋邏輯：點擊 Next 報錯時，直接強制隱藏超時訊息，讓錯誤訊息覆蓋它
                    if (timeWarning) {
                        timeWarning.style.display = 'none';
                    }
                    if (errorWarning) {
                        errorWarning.style.display = 'block';
                        window.scrollTo(0, 0); // 瞬間置頂
                    }
                } else {
                    // 如果有選數字，立刻以最快速度送出表單，絕不鎖死或延遲
                    form.submit();
                }
            });
        }
    });

    // 90 秒超時提醒邏輯
    setTimeout(function() {
        const errorWarning = document.getElementById('error-warning');
        const timeWarning = document.getElementById('time-warning');
        
        // 💡 覆蓋邏輯：時間到了之後，不論目前有沒有錯誤訊息，直接強制隱藏錯誤訊息，讓超時訊息覆蓋它
        if (errorWarning) {
            errorWarning.style.display = 'none';
        }
        if (timeWarning) {
            timeWarning.style.display = 'block';
            window.scrollTo(0, 0); // 超時覆蓋時同樣瞬間置頂提示受試者
        }
    }, 90000); 
</script>
{% endblock %}
