{% extends "global/Page.html" %}

{{ block content }}

<h3><b>第{{ player.round_number }}回合</b></h3>

<div id="time-warning" style="display: none; color: #dc3545; font-weight: bold; margin: 15px 0; border: 2px solid #dc3545; padding: 12px; border-radius: 8px; background-color: #fff5f5;">
    請盡快選擇決策數字！
</div>

<style>
    /* 隱藏 oTree 自動渲染的預設輸入框 */
    #hidden-form-wrapper {
        display: none !important;
    }

    /* 格子容器：分成 10 欄擠在同一行 */
    .number-grid {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 10px; /* 保持舒適間距，讓發光陰影更自然 */
        max-width: 100%;
        margin: 25px 0;
    }

    /* 【顏色更新】單個格子樣式：改回最標準的一般藍色邊框 */
    .number-box {
        border: 2px solid #0d6efd; /* 標準一般藍色邊框 */
        border-radius: 12px;       /* 保持高圓角弧度 */
        padding: 15px 0;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
        color: #0d6efd;            /* 未選取時的文字呈現一般標準藍 */
        cursor: pointer;
        background-color: #ffffff;
        transition: all 0.2s ease-in-out;
        user-select: none;
    }

    /* 滑鼠懸停特效（未被選取時） */
    .number-box:hover:not(.selected) {
        background-color: #f0f5ff; /* 淡淡的藍色 hover 背景 */
        border-color: #0b5ed7;
        transform: scale(1.05);
    }

    /* 【關鍵修改】被選取時的特效：標準一般藍色滿版反白與外發光陰影 */
    .number-box.selected {
        background-color: #0d6efd !important; /* 標準一般藍色反白背景 */
        color: white !important;               /* 文字變白 */
        border-color: #0a58ca !important;
        /* 與圖片一致的一般藍色擴散柔霧陰影 */
        box-shadow: 0 5px 15px rgba(13, 110, 253, 0.45) !important; 
        transform: scale(1.03);
    }
    
</style>

<p class="mb-4">請選擇您的數字</p>

<div id="hidden-form-wrapper">
    {{ form.num }}
</div>

<div class="number-grid">
    <div class="number-box" data-value="11">11</div>
    <div class="number-box" data-value="12">12</div>
    <div class="number-box" data-value="13">13</div>
    <div class="number-box" data-value="14">14</div>
    <div class="number-box" data-value="15">15</div>
    <div class="number-box" data-value="16">16</div>
    <div class="number-box" data-value="17">17</div>
    <div class="number-box" data-value="18">18</div>
    <div class="number-box" data-value="19">19</div>
    <div class="number-box" data-value="20">20</div>
</div>

<div class="d-flex justify-content-center my-4">
    {{ next_button }}
</div>

{{ endblock }}


{% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const boxes = document.querySelectorAll('.number-box');
        const otreeInput = document.getElementById('id_num');

        // 將原生 input 改為 hidden 類型
        if (otreeInput) {
            otreeInput.type = 'hidden'; 
        }

        // 頁面載入時，檢查並恢復先前選取的格子狀態
        if (otreeInput && otreeInput.value) {
            const savedBox = document.querySelector(`.number-box[data-value="${otreeInput.value}"]`);
            if (savedBox) savedBox.classList.add('selected');
        }

        // 綁定格子的點擊事件
        boxes.forEach(box => {
            box.addEventListener('click', function() {
                boxes.forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                
                if (otreeInput) {
                    otreeInput.value = this.getAttribute('data-value');
                }
            });
        });

        // 點擊 oTree 原生下一頁按鈕時的防呆攔截
        const nextBtn = document.querySelector('.otree-next-button');
        if (nextBtn) {
            nextBtn.addEventListener('click', function(e) {
                if (!otreeInput || !otreeInput.value) {
                    e.preventDefault();
                    alert("請先點擊選擇一個數字！");
                }
            });
        }
    });

    // 90 秒超時提醒邏輯
    setTimeout(function() {
        const warningBox = document.getElementById('time-warning');
        if (warningBox) {
            warningBox.style.display = 'block';
        }
    }, 90000); 
</script>
{% endblock %}
