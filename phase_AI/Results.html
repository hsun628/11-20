{% extends "global/Page.html" %}
{% load otree %}

{% block content %}
<h3 class="mb-4"><b>獨立ChatGPT的判斷結果</b></h3>

<p class="mb-4">第二部分各<b>額外說明回合</b>的判斷結果：</p>

<table class="table text-center">
    <thead>
        <tr>
            <th>回合</th>
            <th>獨立ChatGPT的判斷結果</th>
        </tr>
    </thead>
    <tbody>
        {% for entry in reason_history %}
        <tr>
            <td>{{ entry.round }}</td>
            <td>{{ entry.result_text }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<div class="d-flex justify-content-center mt-4">
    {% next_button %}
</div>

{% endblock %}
