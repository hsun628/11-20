{% extends "global/Page.html" %}
{% load otree %}

{% block styles %}
<style>
    /* 💡 保持一致性：隱藏 oTree 原生頂部的錯誤區塊，避免重複出現 */
    .otree-form-errors {
        display: none !important;
    }

    .image-display-container {
        display: flex;
        justify-content: space-around;
        gap: 20px;
        margin: 20px 0;
    }

    .reason-card {
        border: 1px solid #dee2e6;
        border-radius: 12px;
        padding: 25px;
        text-align: left;
        width: 48%;
        background-color: #ffffff;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        display: flex;
        flex-direction: column;
    }

    .reason-header {
        font-weight: bold;
        font-size: 1.1rem;
        color: #555;
        border-bottom: 2px solid #eee;
        margin-bottom: 15px;
        padding-bottom: 5px;
        text-align: center;
    }

    .reasoning-text {
        font-size: 1.05rem;
        line-height: 1.6;
        color: #333;
        min-height: 120px;
        white-space: pre-wrap;
        word-wrap: break-word;
    }

    .options-container {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 30px;
        padding: 20px;
        background-color: transparent;
        border-radius: 10px;
    }

    .btn-choice {
        min-width: 120px;
        padding: 12px 25px;
        font-weight: bold;
        transition: all 0.2s ease; 
    }

    /* 當按鈕被選中時的實心高亮樣式 */
    .btn-choice.active-A, .btn-choice.active-B {
        background-color: #0d6efd !important;
        color: white !important;
    }
    .btn-choice.active-Tie {
        background-color: #6c757d !important;
        color: white !important;
    }
</style>
{% endblock %}

{% block content %}
<h3 class="mb-4 text-center"><b>第{{ player.round_number }}回合</b></h3>

<!-- 錯誤提示區塊 -->
<div id="error-warning" style="display: none; color: #dc3545; font-weight: bold; margin: 15px 0; border: 2px solid #dc3545; padding: 12px; border-radius: 8px; background-color: #fff5f5;">
    請先選擇您認為獨立的ChatGPT判斷較具體的理由！
</div>

<!-- 90 秒超時提醒區塊 -->
<div id="time-warning" style="display: none; color: #dc3545; font-weight: bold; margin: 15px 0; border: 2px solid #dc3545; padding: 12px; border-radius: 8px; background-color: #fff5f5;">
    請盡快做出預測！
</div>

<p class="mb-4 text-center">以下為選擇 <b>熬夜讀書</b> 的兩個決策理由，請預測ChatGPT的判斷結果：</p>

<div class="image-display-container">
    <div class="reason-card">
        <div class="reason-header">理由 A</div>
        <div class="reasoning-text">{{ reason_a }}</div>
    </div>

    <div class="reason-card">
        <div class="reason-header">理由 B</div>
        <div class="reasoning-text">{{ reason_b }}</div>
    </div>
</div>

<input type="hidden" name="prediction" id="prediction-input" value="">

<div class="options-container">
    <button type="button" id="btn-A" onclick="selectOption('A')" class="btn btn-outline-primary btn-choice">理由 A</button>
    <button type="button" id="btn-Tie" onclick="selectOption('Tie')" class="btn btn-outline-secondary btn-choice">兩者平手</button>
    <button type="button" id="btn-B" onclick="selectOption('B')" class="btn btn-outline-primary btn-choice">理由 B</button>
</div>

<!-- 修改關鍵 1：替換為純前端自訂按鈕，防止空表單提交給後端 -->
<div class="d-flex justify-content-center mt-4">
    <button type="button" class="btn btn-primary otree-next-button" id="custom-next-btn">Next</button>
</div>
{% endblock %}

{% block scripts %}
<script>
    // 控制受試者點擊行為的 JS 函數
    function selectOption(val) {
        // 更新隱藏欄位的值
        document.getElementById('prediction-input').value = val;

        // 移除所有按鈕的選取高亮狀態
        document.getElementById('btn-A').classList.remove('active-A');
        document.getElementById('btn-Tie').classList.remove('active-Tie');
        document.getElementById('btn-B').classList.remove('active-B');

        // 為當前點擊的按鈕加上對應的高亮 Class
        if (val === 'A') {
            document.getElementById('btn-A').classList.add('active-A');
        } else if (val === 'Tie') {
            document.getElementById('btn-Tie').classList.add('active-Tie');
        } else if (val === 'B') {
            document.getElementById('btn-B').classList.add('active-B');
        }

        // 💡 覆蓋邏輯：一旦受試者做出選擇，清空清除所有提示訊息
        const errorWarning = document.getElementById('error-warning');
        const timeWarning = document.getElementById('time-warning');
        if (errorWarning) errorWarning.style.display = 'none';
        if (timeWarning) timeWarning.style.display = 'none';
    }

    document.addEventListener("DOMContentLoaded", function() {
        const otreeInput = document.getElementById('prediction-input');
        const errorWarning = document.getElementById('error-warning');
        const timeWarning = document.getElementById('time-warning');
        const form = document.querySelector('form');
        const customNextBtn = document.getElementById('custom-next-btn');

        // 修改關鍵 3：控制自訂 Next 按鈕的防呆攔截
        if (customNextBtn && form) {
            customNextBtn.addEventListener('click', function(e) {
                // 如果受試者還沒有點選任何按鈕（input值為空）
                if (!otreeInput || !otreeInput.value || otreeInput.value.trim() === "") {
                    // 💡 覆蓋邏輯：點擊 Next 報錯時，直接強制隱藏超時訊息，讓錯誤訊息覆蓋它
                    if (timeWarning) {
                        timeWarning.style.display = 'none';
                    }
                    if (errorWarning) {
                        errorWarning.style.display = 'block';
                        window.scrollTo(0, 0); // 瞬間置頂，絕無動畫延遲
                    }
                } else {
                    // 已做選擇，順暢且最快速度送出表單
                    form.submit();
                }
            });
        }
    });

    // 90 秒超時提醒邏輯
    setTimeout(function() {
        const errorWarning = document.getElementById('error-warning');
        const timeWarning = document.getElementById('time-warning');
        
        // 💡 覆蓋邏輯：時間到了之後，不論目前有沒有錯誤訊息，直接強制隱藏錯誤訊息，讓超時訊息覆蓋它
        if (errorWarning) {
            errorWarning.style.display = 'none';
        }
        if (timeWarning) {
            timeWarning.style.display = 'block';
            window.scrollTo(0, 0); // 超時覆蓋時同樣瞬間置頂提示受試者
        }
    }, 90000); 
</script>
{% endblock %}
